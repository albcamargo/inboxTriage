# landing/apache.conf - ISPConfig produccion Apache 2.4 - InboxTriage
# Copia este archivo a /etc/apache2/sites-available/inboxtriage.conf en tu servidor ISPConfig
# o usa ISPConfig UI: Sites -> Website -> Options -> Apache Directives -> pegar contenido <Directory>
# DocumentRoot debe apuntar a /var/www/inboxtriage/landing o /var/www/clients/clientX/webY/web/landing

<VirtualHost *:80>
    ServerName inboxtriage.tu-dominio.com
    ServerAlias www.inboxtriage.tu-dominio.com
    DocumentRoot /var/www/inboxtriage/landing

    # Redirect a HTTPS - ISPConfig Let's Encrypt
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/inboxtriage_error.log
    CustomLog ${APACHE_LOG_DIR}/inboxtriage_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName inboxtriage.tu-dominio.com
    ServerAlias www.inboxtriage.tu-dominio.com
    DocumentRoot /var/www/inboxtriage/landing

    # SSL - ISPConfig maneja automaticamente con Let's Encrypt
    # Si usas ISPConfig UI, no necesitas estas lineas, las genera el panel
    SSLEngine on
    SSLCertificateFile /var/www/inboxtriage/ssl/inboxtriage.tu-dominio.com-le.crt
    SSLCertificateKeyFile /var/www/inboxtriage/ssl/inboxtriage.tu-dominio.com-le.key
    #Include /etc/letsencrypt/options-ssl-apache.conf

    # Seguridad - PITCH.md RNF-02, RNF privacidad
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # Gzip
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # Cache estatico - landing 100% estatica
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/html "access plus 0 seconds"
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
    </IfModule>

    <Directory /var/www/inboxtriage/landing>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA fallback - ISPConfig landing es index.html unico
        FallbackResource /index.html

        # Bloquea acceso a dotfiles y PITCH/CICLO si no quieres exponerlos publico
        # Comenta estas lineas si SI quieres que /PITCH.md sea publico para jueces
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # No exponer .git, node_modules, tokens, env, logs - RNF-02
    <DirectoryMatch "^/var/www/inboxtriage/(\.git|node_modules|models|scripts)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(^\.env$|^tokens\.json$|^triage\.log$|^fixtures\.json$)">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/inboxtriage_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/inboxtriage_ssl_access.log combined

    # Logs rotacion ISPConfig
    # CustomLog ya manejado por ISPConfig
</VirtualHost>

